AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Backend serverless de Mision Emprende UDD

Parameters:
  Entorno:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

  NombreTabla:
    Type: String
    Default: MisionEmprende-prod
    Description: Nombre de la tabla DynamoDB creada por Terraform (Global Tables).

  OrigenCors:
    Type: String
    Default: "*"
    Description: Dominio autorizado para consumir la API.

  ClaveToken:
    Type: String
    NoEcho: true
    Default: cambiar-antes-de-produccion
    Description: Clave usada para firmar los tokens.

  ClaveAccesoProfesor:
    Type: String
    NoEcho: true
    Default: profe123
    Description: Clave temporal de acceso del profesor.

  DynamoDbEndpointLocal:
    Type: String
    Default: ""
    Description: >
      Endpoint de DynamoDB local (solo para sam local). Vacío en AWS real,
      donde el SDK usa el endpoint real de DynamoDB automáticamente.

  RegionDynamoPrincipal:
    Type: String
    Default: us-east-1
    Description: Region DynamoDB utilizada como principal por el backend.

  RegionDynamoRespaldo:
    Type: String
    Default: us-west-2
    Description: Region DynamoDB utilizada para failover.

  SimularFalloDynamoPrincipal:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Simula indisponibilidad de la replica DynamoDB principal.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    MemorySize: 512
    Timeout: 15
    Environment:
      Variables:
        NOMBRE_TABLA: !Ref NombreTabla
        CLAVE_TOKEN: !Ref ClaveToken
        CLAVE_ACCESO_PROFESOR: !Ref ClaveAccesoProfesor
        DURACION_TOKEN_SEGUNDOS: "28800"
        ORIGEN_CORS: !Ref OrigenCors
        ENTORNO: !Ref Entorno
        DYNAMODB_ENDPOINT: !Ref DynamoDbEndpointLocal
        DYNAMODB_REGION_PRINCIPAL: !Ref RegionDynamoPrincipal
        DYNAMODB_REGION_RESPALDO: !Ref RegionDynamoRespaldo
        SIMULAR_FALLO_DYNAMODB_PRINCIPAL: !Ref SimularFalloDynamoPrincipal

  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - !Ref OrigenCors
      AllowHeaders:
        - Authorization
        - Content-Type
      AllowMethods:
        - GET
        - POST
        - OPTIONS
      MaxAge: 600

Resources:
  ApiBackend:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"

  FuncionAcceso:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/acceso/api.manejador
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        Ingresar:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/acceso/ingresar
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/acceso/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs

  FuncionProfesor:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/profesor/api.manejador
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        IngresarProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/ingresar
            Method: POST
        ListarSesionesProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones
            Method: GET
        CrearSesionProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones
            Method: POST
        ObtenerSesionProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones/{sesionId}
            Method: GET
        AccionesSesionProfesor:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/profesor/sesiones/{sesionId}/acciones
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/profesor/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
        Format: cjs

  FuncionSesiones:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/sesiones/api.manejador
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        ObtenerSesionActual:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiBackend
            Path: /api/sesiones/actual
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/sesiones/api.ts
        Bundle: true
        Minify: false
        Sourcemap: true
        Target: es2022
        Platform: node
